services:
  postgres:
    image: postgres:16-alpine
    container_name: biblioteca-virtual-postgres
    environment:
      POSTGRES_DB: biblioteca_virtual
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biblioteca_virtual"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - biblioteca_postgres_data:/var/lib/postgresql/data

volumes:
  biblioteca_postgres_data:
